# Mergify merge queue for the default branch.
# Add the `merge-hold` label when a PR is approved in spirit but must not be
# queued yet. This lets reviewers leave approval-adjacent comments without
# Mergify landing the PR before small follow-ups are pushed.
# GitHub rulesets already require PRs, squash merges, and one approval on master.
# Require every GitHub review thread to be resolved before queueing or merging.
# This makes CodeRabbit and human review comments explicit blockers instead of
# letting an approval send unresolved feedback to Mergify.
# The `fast-lane` label is human-applied only, for low-risk PRs that must
# bypass the full queue under runner saturation. It still requires build
# artifacts, PR Body schema, and type-checks. Inter-queue order is no longer
# implied by definition order (removed by Mergify 2025-06-30); the top-level
# priority_rules entry below gives fast-lane PRs global queue priority.

priority_rules:
  - name: fast-lane PRs jump the queue
    conditions:
      - label=fast-lane
    priority: high

queue_rules:
  - name: fast-lane
    merge_method: squash
    batch_size: 1
    batch_max_wait_time: 0s
    checks_timeout: 30min
    queue_conditions:
      - base=master
      - -draft
      - label=fast-lane
      - -label=admin-bypass
      - -label=merge-hold
      - "#review-threads-unresolved = 0"
    merge_conditions:
      - check-success = build-artifacts
      - check-success = PR Body
      - check-success = quality / TypeScript Types
      - "#review-threads-unresolved = 0"

  - name: default
    merge_method: squash
    batch_size: 5
    batch_max_wait_time: 5min
    checks_timeout: 60min
    queue_conditions:
      - base=master
      - -draft
      - "#approved-reviews-by >= 1"
      - -label=merge-hold
      - "#review-threads-unresolved = 0"
    # Heavy e2e proof and the full Vitest Workspace run on PRs but do NOT block
    # Mergify (the whole-workspace suite is currently red on master — unrelated
    # worker-registry + SSH executor drift). "UI Vitest" runs only @invoker/ui
    # and IS required: it holds the UI component guards, so a UI regression
    # cannot merge even when the diff still type-checks.
    # required-fast / Merge Gate Concurrency Repro, Launch Dispatch Queue
    # Repro, Start Running MECE Repros, and Branch Carry Forward guard core
    # task/workflow state-machine and dispatch behavior, run in parallel with
    # the checks above (~1 min each), and have been green for 5+ consecutive
    # master runs — promoted to required at effectively no queue-wait cost.
    # required-fast / Reset Rulebook Repro was deliberately left non-required:
    # same core-behavior class, but 6-13 min per run would materially slow
    # every merge.
    merge_conditions: &required_checks
      - check-success = build-artifacts
      - check-success = quality / Dependency Cruise
      - check-success = PR Body
      - check-success = quality / TypeScript Types
      - check-success = required-fast / Guardrails
      - check-success = required-fast / Submit Workflow Chain
      - check-success = required-fast / Merge Gate Concurrency Repro
      - check-success = required-fast / Launch Dispatch Queue Repro
      - check-success = required-fast / Start Running MECE Repros
      - check-success = required-fast / Branch Carry Forward
      - check-success = UI Vitest
      - "#review-threads-unresolved = 0"

  - name: admin-bypass
    merge_method: squash
    batch_size: 1
    batch_max_wait_time: 5min
    checks_timeout: 60min
    queue_conditions:
      - base=master
      - -draft
      - label=admin-bypass
      - -label=merge-hold
      - "#review-threads-unresolved = 0"
    # Same required checks as the default queue — see the comment above.
    merge_conditions: *required_checks

pull_request_rules:
  - name: autoqueue ready approved PRs to master
    conditions:
      - base=master
      - -draft
      - "#approved-reviews-by >= 1"
      - label=ready-to-merge
      - -label=fast-lane
      - -label=admin-bypass
      - -label=merge-hold
      - "#review-threads-unresolved = 0"
    actions:
      queue:
        name: default

  - name: autoqueue admin-bypass PRs to master
    conditions:
      - base=master
      - -draft
      - label=admin-bypass
      - -label=merge-hold
      - "#review-threads-unresolved = 0"
    actions:
      queue:
        name: admin-bypass

  - name: autoqueue fast-lane PRs to master
    conditions:
      - base=master
      - -draft
      - label=fast-lane
      - -label=admin-bypass
      - -label=merge-hold
      - "#review-threads-unresolved = 0"
    actions:
      queue:
        name: fast-lane

  # Merged head branches were never cleaned up, so the remote accumulated
  # ~25.8k branches, 222 of them already merged into master. `force` stays at
  # its default of false: Mergify then skips deletion while another open PR is
  # still based on the branch, so a Mergify Stack is never orphaned.
