name: "Repair PR 6976 Step 3: Terminal snapshot trim repro"
description: |
  Finish the PR #6976 repair by moving the separate truncated ANSI escape snapshot repro/fix into its own app behavior slice.

  This workflow depends on the terminal-size app-routing workflow only to preserve stack order while keeping the review claim separate. It contains the `trimOutputSnapshot` escape-sequence fix and its direct regression test, and it runs the final full-suite gate for the repair stack.

  Invoker-on-Invoker publication note: keep the resulting PR stack in Mergify Stacks after the work is ready by using `mergify stack push`.
onFinish: pull_request
mergeMode: external_review
repoUrl: https://github.com/Neko-Catpital-Labs/Invoker.git
baseBranch: master
externalDependencies:
  - workflowId: "__UPSTREAM_WORKFLOW_ID__"
    taskId: "__merge__"
    requiredStatus: completed

tasks:
  - id: implement-terminal-snapshot-trim-repro
    description: |
      Add escape-aware output snapshot trimming plus the remount garble repro.
      Review claim: Approve that terminal output snapshots no longer begin with a dangling CSI/OSC escape fragment after truncation.
      Review lane: behavior
      Review unit: routing
      Safety invariant: The trim change only moves the retained snapshot start backward within a bounded 512-character lookback when truncation would otherwise cut an escape sequence; normal below-limit snapshots and snapshots without a cut escape sequence keep prior behavior.
      Slice rationale: This is a separate bugfix from terminal resize confirmation and does not belong in PR #6976's contract/app-size plumbing review.
      Architectural effect: The embedded terminal manager keeps escape-sequence boundaries intact before the UI replays a snapshot into a remounted terminal.
      Goal: Preserve the reproducible tmux/planning-terminal remount garble fix as its own validator-compliant PR.
      Motivation: The current PR includes this unrelated repro/fix, widening the diff and contributing to CI failures.
      Alternative considerations: Dropping the repro was rejected because the failure is reproducible and should remain covered; bundling it with resize confirmation was rejected because it is a separate review claim.
      Implementation details: Starting from the previous workflow's feature branch, inspect PR #6976 at `35927dc2ef3c4176958f499cc88257802bef0554` and apply only the escape-aware `trimOutputSnapshot` helper changes plus `packages/app/src/__tests__/embedded-terminal-truncated-escape-garble-repro.test.ts`. Keep directly required fake backend shape updates if needed for compile compatibility, but do not edit contracts, execution-engine, IPC channel definitions, or renderer resize policy in this workflow.
      Non-goals: No terminal initial-size contract changes, no applied-size IPC channel, no renderer resize retry activation, and no unrelated terminal cleanup.
      Layer: app_bridge
      Feature state: active
      Files:
      - packages/app/src/embedded-terminal-manager.ts
      - packages/app/src/__tests__/embedded-terminal-truncated-escape-garble-repro.test.ts
      Change types:
      - packages/app/src/embedded-terminal-manager.ts: modify
      - packages/app/src/__tests__/embedded-terminal-truncated-escape-garble-repro.test.ts: create
      Acceptance criteria:
      - `cd packages/app && pnpm test -- src/__tests__/embedded-terminal-truncated-escape-garble-repro.test.ts` exits 0.
      - `cd packages/app && pnpm test -- src/__tests__/embedded-terminal-manager.test.ts src/__tests__/embedded-terminal-truncated-escape-garble-repro.test.ts` exits 0.
      - A local PR body for this workflow validates with `node scripts/validate-pr-body-local.mjs --body-file <body-file> --base master --base-remote origin`.
      - `git diff --name-only origin/master...HEAD` does not include `packages/contracts/src/ipc-channels.ts` or `packages/execution-engine/src/executor.ts`.
    prompt: |
      Assume no prior context. Continue the PR #6976 repair stack after the terminal-size app-routing workflow.
      Goal: Move the truncated ANSI escape snapshot repro/fix from PR head `35927dc2ef3c4176958f499cc88257802bef0554` into its own app behavior PR.
      Review lane: behavior
      Review claim: Approve that terminal output snapshots no longer begin with a dangling CSI/OSC escape fragment after truncation.
      Safety invariant: The trim change only moves the retained snapshot start backward within a bounded 512-character lookback when truncation would otherwise cut an escape sequence; normal below-limit snapshots and snapshots without a cut escape sequence keep prior behavior.
      Slice rationale: This is not the same review claim as terminal resize confirmation, so keep it separate from the contract and app-size workflows.
      Architectural effect: The embedded terminal manager keeps escape-sequence boundaries intact before the UI replays a snapshot into a remounted terminal.
      Motivation: The current PR combines this independent terminal garbling repro/fix with resize plumbing, causing an invalid broad diff.
      Alternative considerations: Do not delete the repro; preserve it because the failure is reproducible. Do not bundle contract or IPC-channel edits in this workflow.
      Implementation details: Starting from the previous workflow's feature branch, inspect PR #6976 at `35927dc2ef3c4176958f499cc88257802bef0554`. Apply only the escape-aware `trimOutputSnapshot` helper changes to `packages/app/src/embedded-terminal-manager.ts` and add `packages/app/src/__tests__/embedded-terminal-truncated-escape-garble-repro.test.ts`. Keep directly required fake backend shape updates if TypeScript requires them, but avoid contracts, execution-engine, IPC channel definitions, and renderer resize policy. Commit the result locally.
      Non-goals: No terminal initial-size contract changes, no applied-size IPC channel, no renderer resize retry activation, and no unrelated terminal cleanup.
      Deterministic pass/fail expectations:
      - `cd packages/app && pnpm test -- src/__tests__/embedded-terminal-truncated-escape-garble-repro.test.ts` exits 0.
      - `cd packages/app && pnpm test -- src/__tests__/embedded-terminal-manager.test.ts src/__tests__/embedded-terminal-truncated-escape-garble-repro.test.ts` exits 0.
      - `git diff --name-only origin/master...HEAD` does not list `packages/contracts/src/ipc-channels.ts` or `packages/execution-engine/src/executor.ts`.
      - The implementer must ensure a GitHub body using Review Lane `behavior` and Review Unit `routing` passes the repo's local body checker with exit code 0.
    dependencies: []

  - id: verify-terminal-snapshot-trim-repro
    description: |
      Run the focused app repro for truncated terminal escape snapshots.
      Review claim: The repro passes only when snapshot trimming preserves escape-sequence boundaries.
      Review lane: proof
      Review unit: proof
      Safety invariant: This task only runs the focused app regression test.
      Slice rationale: Keep the repro proof next to the bugfix before the terminal full-suite gate.
      Architectural effect: None.
      Goal: Prove the remount garble regression is covered after the split.
      Motivation: The user requested an updated repro when the failure is reproducible.
      Alternative considerations: Manual terminal inspection was rejected because xterm replay is scriptable.
      Implementation details: Execute the focused Vitest repro from `packages/app`.
      Non-goals: No code edits in this task.
      Layer: app_regression
      Feature state: active
    command: "cd packages/app && pnpm test -- src/__tests__/embedded-terminal-truncated-escape-garble-repro.test.ts"
    dependencies:
      - implement-terminal-snapshot-trim-repro

  - id: verify-terminal-repair-stack-full-suite
    description: |
      Run the full CI-equivalent regression gate for the terminal repair stack.
      Review claim: The repaired stack is ready only if the repo-wide test suite passes after all split PRs.
      Review lane: proof
      Review unit: proof
      Safety invariant: This task is verification-only and runs after the implementation and focused repro tasks.
      Slice rationale: The terminal stack workflow carries the final full-suite gate required for implementation stacks.
      Architectural effect: None.
      Goal: Prove the split terminal repair stack is not hiding broader regressions.
      Motivation: PR #6976 also had several non-PR-body failures, so the final stack must use the broad local proof surface.
      Alternative considerations: Focused tests alone were rejected because the latest Mergify event listed typecheck, build, dependency, and UI Vitest failures too.
      Implementation details: Execute `pnpm run test:all` from the repository root and require exit code 0.
      Non-goals: No code edits in this task.
      Layer: e2e_regression
      Feature state: active
    command: "pnpm run test:all"
    dependencies:
      - implement-terminal-snapshot-trim-repro
      - verify-terminal-snapshot-trim-repro
