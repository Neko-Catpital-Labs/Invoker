name: "Repair UI Vitest native build prerequisites"
description: |
  Repair the shared UI Vitest runner prerequisite independently of PR #9185.

  UI Vitest's dependency install falls back from a missing node-pty Linux x64
  prebuild to node-gyp. The affected Runner_Vitest host has Python, but not
  make, so the job exits before Vitest starts. The existing workflow-policy
  test checks libatomic1 ordering but does not protect the native build tools.

  Safety invariant: PR #9185 remains untouched and scoped to PR Authoring
  Guardrails; UI Vitest's runner label, Node version, dependency command, test
  command, and every other CI job remain unchanged. Only UI Vitest's existing
  system-dependency step and its directly affected policy assertion change.
onFinish: pull_request
mergeMode: external_review
baseBranch: master
repoUrl: https://github.com/Neko-Catpital-Labs/Invoker.git

tasks:
  - id: provision-ui-vitest-native-build-tools
    description: |
      Add the missing UI Vitest native build prerequisites and their focused regression assertion.
      Review claim: UI Vitest installs libatomic1, make, and g++ before pnpm may invoke node-gyp for node-pty.
      Review lane: policy
      Safety invariant: PR #9185 remains untouched; UI Vitest's Runner_Vitest assignment, Node 26 selection, frozen-lockfile install, test command, and every other CI job stay unchanged.
      Slice rationale: The existing UI Vitest system-dependency step and the exact workflow-policy assertion that protects it are one CI-policy unit, separate from #9185's hosted-capacity claim.
      Architectural effect: UI Vitest runner preparation explicitly owns the native compiler prerequisites needed by dependency installation; product control flow and public interfaces do not change.
      Goal: Allow UI Vitest dependency installation to compile node-pty when its Linux x64 prebuild is unavailable.
      Motivation: GitHub job 94987863334 never reached Vitest because node-pty fell back to node-gyp and node-gyp reported `Error: not found: make`.
      Alternative considerations: Re-running cannot add a missing executable; changing Node, node-pty, lifecycle scripts, or runner assignment would broaden the repair and obscure the missing prerequisite.
      Implementation details: First strengthen the UI Vitest section of scripts/test-ci-workflow-merge-queue-policy.mjs to require libatomic1, make, and g++ in the named pre-Node system-dependency step and confirm that assertion fails against the unmodified workflow. Then add make and g++ to that existing apt install line in .github/workflows/ci.yml and rerun the same policy test.
      Non-goals: No edits to PR #9185, product or UI behavior, dependency versions, Node version, runner assignment, lifecycle policy, or unrelated CI jobs.
      Layer: e2e_regression
      Feature state: active
      Files:
      - .github/workflows/ci.yml
      - scripts/test-ci-workflow-merge-queue-policy.mjs
      Change types:
      - .github/workflows/ci.yml: modify
      - scripts/test-ci-workflow-merge-queue-policy.mjs: modify
      Acceptance criteria:
      - Before the workflow edit, the strengthened policy assertion exits nonzero because UI Vitest lacks make and g++.
      - `node scripts/test-ci-workflow-merge-queue-policy.mjs` exits 0 after the workflow edit.
      - The final assertion requires libatomic1, make, and g++ before actions/setup-node and pnpm install.
      - UI Vitest still uses Runner_Vitest, Node 26, `pnpm install --frozen-lockfile`, and `pnpm --filter @invoker/ui test`.
    prompt: |
      Review claim: UI Vitest installs libatomic1, make, and g++ before pnpm may invoke node-gyp for node-pty.
      Review lane: policy
      Safety invariant: PR #9185 remains untouched; UI Vitest's Runner_Vitest assignment, Node 26 selection, frozen-lockfile install, test command, and every other CI job stay unchanged.
      Slice rationale: Keep UI Vitest runner provisioning and its directly affected policy assertion together as one CI-policy unit, independent of PR #9185's PR Authoring Guardrails change.
      Architectural effect: Make UI Vitest runner preparation own the native compiler prerequisites needed by dependency installation; do not change product control flow or public interfaces.
      Goal: Fix the shared UI Vitest failure seen in https://github.com/Neko-Catpital-Labs/Invoker/actions/runs/31874407167/job/94987863334.
      Motivation: The job log says node-pty's prebuilds/linux-x64 directory does not exist, node-gyp finds Python, and then exits with `Error: not found: make`; Vitest never starts.
      Alternative considerations: Do not change Node, node-pty, lifecycle scripts, or the runner assignment, and do not fold this repair into PR #9185.
      Implementation details: Assume no prior context. Work from current master. First edit only scripts/test-ci-workflow-merge-queue-policy.mjs so its UI Vitest policy requires the named `Install Node runtime system dependencies` step to appear before actions/setup-node and pnpm install and to install libatomic1, make, and g++. Run `node scripts/test-ci-workflow-merge-queue-policy.mjs` and record the expected failure caused by the unchanged workflow. Then edit only .github/workflows/ci.yml to add make and g++ to UI Vitest's existing apt install command. Rerun the same policy test and require exit 0. Keep the assertion focused on package tokens in the apt install command, not incidental substring matches elsewhere in the shell step.
      Non-goals: No edits to PR #9185, product/UI code, dependency versions, runner labels, Node versions, test commands, or unrelated workflow jobs.
      Files:
      - .github/workflows/ci.yml
      - scripts/test-ci-workflow-merge-queue-policy.mjs
      Change types:
      - .github/workflows/ci.yml: modify
      - scripts/test-ci-workflow-merge-queue-policy.mjs: modify
      Acceptance criteria:
      - The strengthened policy test fails before the workflow edit because make and g++ are absent.
      - `node scripts/test-ci-workflow-merge-queue-policy.mjs` exits 0 after the workflow edit.
      - UI Vitest remains on Runner_Vitest with Node 26, frozen-lockfile dependency installation, and `pnpm --filter @invoker/ui test`.
    dependencies: []

  - id: verify-ui-vitest-native-build-tools
    description: |
      Run the focused workflow-policy regression check after the repair.
      Review claim: The workflow-policy test passes only when UI Vitest provisions its required runtime and native build packages before dependency installation.
      Review lane: proof
      Safety invariant: Verification reads the committed workflow and test without modifying repository state.
      Slice rationale: A terminal deterministic check gives the implementation slice one explicit pass/fail proof surface.
      Architectural effect: None; this task executes existing repository policy code only.
      Goal: Prove the repaired workflow retains the complete UI Vitest prerequisite contract.
      Motivation: The prior test passed while make and g++ were absent, so the strengthened assertion must be exercised after implementation.
      Alternative considerations: A grep-only check was rejected because it would not parse the workflow structure or enforce step ordering.
      Implementation details: Execute `node scripts/test-ci-workflow-merge-queue-policy.mjs` from the repository root and require exit 0.
      Non-goals: No file edits, CI submission, PR #9185 mutation, or broad test-suite execution.
      Layer: e2e_regression
      Feature state: active
    command: "node scripts/test-ci-workflow-merge-queue-policy.mjs"
    dependencies:
      - provision-ui-vitest-native-build-tools
