name: "Continue babysit worker landing loop"
description: |
  Continue the babysit worker landing loop from `pr/babysit-prereq-split` on a
  DigitalOcean Invoker runner.

  The current branch already removed the generic retry cap block for #5803 and
  taught the worker to surface split-only PR Body failures as human-only
  blockers. The next task is to keep following LOOP.md against the live PR set
  until the worker either lands each worker-fixable target or records an exact
  human-only stop reason.
onFinish: pull_request
mergeMode: external_review
repoUrl: git@github.com:Neko-Catpital-Labs/Invoker.git
baseBranch: pr/babysit-prereq-split

tasks:
  - id: continue-babysit-worker-loop
    description: |
      Continue the babysit worker loop against the live `admin-bypass` / `dequeued` PR set.
      Review claim: The worker keeps making forward progress on real stuck babysit PRs by fixing worker-owned failures and surfacing exact human-only blockers instead of generic capped retries.
      Review lane: behavior
      Safety invariant: The task uses worker actions only for target PRs; it does not manually requeue, relabel, merge, split, rebase, or force-push the real PR branches.
      Slice rationale: One behavior slice: continue the existing worker loop from the pushed branch, using the current worker evidence and deterministic repro surface.
      Architectural effect: None; this continues the existing worker + repro loop without introducing a new subsystem.
      Goal: Make the babysit worker land worker-fixable real targets or stop once with an explicit human-only reason.
      Motivation: Real `admin-bypass` / `dequeued` PRs are still stuck; the worker must own the fix path instead of requiring manual cleanup.
      Alternative considerations: Manual PR edits, queue commands, stack surgery, or force-pushes were rejected because they hide worker defects instead of fixing them.
      Implementation details: Regenerate the live target set with `bash ./loop-driver.sh --skip-battle`. Gather evidence from the ledger, `gh pr view`, repair transcripts, and existing repros. If the target is worker-fixable, edit only the worker/repro files needed for that case, rerun `bash ./loop-driver.sh`, then rerun the real worker on that PR. If the target is human-only, make the worker post the exact reason once and stop retrying.
      Non-goals: No manual real-PR cleanup, no unrelated refactors, no metadata-only PR edits, no queue-rule changes outside what the worker itself needs.
      Layer: app_bridge
      Feature state: active
      Files: battle-loop.sh; loop-driver.sh; scripts/mergify_admin_requeue_exec.py; scripts/mergify_admin_requeue_plan.py; scripts/mergify_admin_requeue_repairer.py; scripts/mergify_admin_requeue_loader.py; scripts/mergify_admin_requeue_snapshot.py; scripts/test-suites/required/12-mergify-admin-requeue.sh; scripts/test_mergify_admin_requeue.py; scripts/test_mergify_admin_requeue_plan.py
      Change types:
      - battle-loop.sh: modify
      - loop-driver.sh: modify
      - scripts/mergify_admin_requeue_exec.py: modify
      - scripts/mergify_admin_requeue_plan.py: modify
      - scripts/mergify_admin_requeue_repairer.py: modify
      - scripts/mergify_admin_requeue_loader.py: modify
      - scripts/mergify_admin_requeue_snapshot.py: modify
      - scripts/test-suites/required/12-mergify-admin-requeue.sh: modify
      - scripts/test_mergify_admin_requeue.py: modify
      - scripts/test_mergify_admin_requeue_plan.py: modify
      Acceptance criteria:
      - `bash ./loop-driver.sh` exits 0 after each worker fix.
      - The task reruns the real worker after each worker fix instead of stopping at local green.
      - The final report names each touched real PR and shows whether the worker landed it or surfaced a human-only blocker.
    prompt: |
      Goal: Continue the babysit worker landing loop from `pr/babysit-prereq-split` until the worker lands each worker-fixable real target or posts one exact human-only blocker and stops retrying.
      Review lane: behavior
      Motivation: Real `admin-bypass` / `dequeued` PRs are still stuck; the worker must own the recovery path instead of relying on manual cleanup.
      Alternative considerations: Do not manually edit, queue, relabel, rebase, split, merge, or force-push the target PRs. Fix worker logic and rerun the worker instead.
      Implementation details: Follow LOOP.md exactly. Start by running `bash ./loop-driver.sh --skip-battle` to regenerate the live target set and ledger fail summary. Pick the highest-signal worker-owned target from that live set. Gather evidence from the ledger, `gh pr view`, repair transcripts, and existing repros before touching code. If the target is worker-fixable, edit only the worker/repro files needed for that case, rerun `bash ./loop-driver.sh`, then rerun the real worker on that PR. If the target is human-only, make the worker post the exact reason once and stop retrying. Commit only when local loop evidence is green for the fix you made.
      Non-goals: No unrelated refactors, no queue policy rewrites outside the current failure, no manual real-PR cleanup.
      Assume no prior context. You are given only this task.
      Acceptance criteria:
      - `bash ./loop-driver.sh` exits 0 after each worker-owned fix.
      - The real worker is rerun after each worker-owned fix.
      - The final result shows worker-caused progress on the real target set, not manual PR edits.
    poolId: remote_digital_ocean_1
    dependencies: []

  - id: verify-babysit-worker-loop
    description: |
      Run the local loop verifier after the implementation work.
      Review claim: `bash ./loop-driver.sh` stays green only when the local worker loop and repro surface still hold.
      Review lane: proof
      Safety invariant: This task only runs the existing loop verifier.
      Slice rationale: One proof slice: rerun the same local loop checker after implementation.
      Architectural effect: None.
      Goal: Prove the updated worker loop still passes its deterministic local verification.
      Motivation: The loop checker guards the worker and repro contract while the real PR work continues.
      Alternative considerations: Manual inspection was rejected as non-deterministic.
      Implementation details: Execute `bash ./loop-driver.sh` from the repo root.
      Non-goals: No code edits in this task.
      Layer: e2e_regression
      Feature state: active
    command: "bash ./loop-driver.sh"
    poolId: remote_digital_ocean_1
    dependencies:
      - continue-babysit-worker-loop
