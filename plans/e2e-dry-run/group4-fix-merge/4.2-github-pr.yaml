# E2E dry-run Group 4.2 — mergeMode=github creates a PR via stub gh CLI.
name: "e2e-dry-run group4 4.2 github-pr"
repoUrl: git@github.com:example-org/acme-repo.git
onFinish: pull_request
mergeMode: external_review
featureBranch: experiment/e2e-g442-pr-test
baseBranch: HEAD

tasks:
  - id: e2e-g442-taskA
    description: "E2E 4.2 — first task"
    command: 'mkdir -p e2e-artifacts && printf "pr-test-a\n" > e2e-artifacts/group4-2-a.txt'
    dependencies: []
  - id: e2e-g442-taskB
    description: "E2E 4.2 — second task"
    command: 'mkdir -p e2e-artifacts && printf "pr-test-b\n" > e2e-artifacts/group4-2-b.txt'
    dependencies: []
