      Non-goals: No script changes, no package changes, no contract changes, no E2E fixture changes.
      Layer: docs
      Feature state: active
      Files:
      - docs/persistence-architecture-single-writer.md
      Change types:
      - docs/persistence-architecture-single-writer.md: modify
      Acceptance criteria:
      - The document contains `invoker:set-workflow-merge-mode` in the GUI IPC handler table.
      - The resulting PR body declares Review Lane `docs` and Review Unit `docs`.
      - `rg -n 'invoker:set-workflow-merge-mode' docs/persistence-architecture-single-writer.md` exits 0.
