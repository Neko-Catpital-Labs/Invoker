      Slice rationale: Prose must review separately from product contract deletion and policy tooling to satisfy the PR Body gate.
      Architectural effect: Documentation reflects the current owner-boundary command map; runtime behavior is unchanged.
      Goal: Create the docs split slice for PR #5942.
      Motivation: The original PR failed PR Body because it mixed docs with policy and contract files.
      Alternative considerations: Do not bundle this prose with the policy verifier; the validator classifies `docs/` as a docs unit.
      Implementation details: Assume no prior context. Use PR #5942 at head `fd3cab221191d8c2c7be949f2ba923fabcf91bbd` as the source patch, but apply only `docs/persistence-architecture-single-writer.md`. Update the GUI IPC handler table row from `invoker:set-merge-mode` / `main.ts:1129` to `invoker:set-workflow-merge-mode` / `gui-mutation-handlers.ts:2276`.
      Non-goals: No script changes, no package changes, no contract changes, no E2E fixture changes.
      Files:
      - docs/persistence-architecture-single-writer.md
      Change types:
      - docs/persistence-architecture-single-writer.md: modify
      Acceptance criteria:
