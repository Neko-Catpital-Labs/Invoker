      Review claim: The docs slice contains the canonical workflow merge-mode IPC path.
      Review lane: proof
      Safety invariant: This task reads the docs file only and does not modify source files.
      Slice rationale: A focused text check proves the docs-only update without pulling product or policy paths into the PR.
      Architectural effect: No architecture change; this is documentation proof only.
      Goal: Verify the updated architecture table mentions the canonical path.
      Motivation: The docs update should be mechanically checkable.
      Alternative considerations: Manual inspection was rejected as non-deterministic.
