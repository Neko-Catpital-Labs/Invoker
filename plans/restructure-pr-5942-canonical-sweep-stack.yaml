      Architectural effect: No new runtime path is introduced; the tooling-policy gate becomes an accurate guard for canonical command, IPC, HTTP, and storage-label surfaces.
      Goal: Produce a reviewable stack shape where each PR's claimed proof passes at that PR's own head.
      Motivation: In the repair checkout, a straight rebase of PR #5942 onto `master` skipped stale stack commits and left only the verifier commit, but `pnpm run verify-empty-canonical-sweeps` failed.
      Alternative considerations: Do not silently weaken the verifier to ignore true live legacy surfaces. Do not fold unrelated cleanup into one oversized conflict-resolution commit. Either move verifier activation after docs and contract cleanup, or split PR #5942 into a dormant helper introduction plus a later activation/checker-tightening slice.
      Implementation details: Fetch these refs: PR #5942 head `stack/EdbertChan/plan/remove-deprecated-merge-mode-and-retry-paths-review/remove-deprecated-merge-mode-retry-paths-11-add--d1404549`, PR #5943 head `stack/EdbertChan/plan/remove-deprecated-merge-mode-and-retry-paths-review/remove-deprecated-merge-mode-retry-paths-12--9bfcc7ba`, and PR #5944 head `stack/EdbertChan/plan/remove-deprecated-merge-mode-and-retry-paths-review/remove-deprecated-merge-mode-retry-paths-13-drop--b15de57b`. Current `master` already contains stack steps 1-10 under different SHAs. Rebase or reconstruct the remaining stack from `master`, preserving the intended content of #5942/#5943/#5944 but changing the ordering or split so each PR proof is truthful. The observed failing proof on rebased #5942 was `pnpm run verify-empty-canonical-sweeps`; it reported stale `set-merge-mode` references in docs/contracts/headless alias rejection tests/drift fixtures and stale `/restart` references in API negative tests. The upper stack shows #5943 refreshes docs and #5944 drops deprecated IPC channel names, while the final stack still legitimately contains the removed headless alias string in `isRemovedHeadlessCommandAlias` and tests proving it is rejected. Encode those intentional references as explicit allowlist entries and keep the verifier strict for live docs, contracts, handlers, routes, registries, and usage text. Update PR body/test-plan text when a proof moves to a later slice. After local verification is green, publish/update the resulting Invoker PR stack with Mergify Stacks.
