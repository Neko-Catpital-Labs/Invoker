name: "Restructure PR 5942 canonical sweep verifier"
onFinish: pull_request
mergeMode: external_review
repoUrl: https://github.com/Neko-Catpital-Labs/Invoker.git
baseBranch: master
featureBranch: plan/restructure-pr-5942-canonical-sweep-stack
description: |
  Restructure the remove-deprecated-merge-mode-and-retry-paths stack so PR #5942 does not land a verifier before the code and docs that make the verifier true.

  Conflict diagnosis from the repair checkout: PR #5942 is open at head SHA b4b19b6fb6635add73f22c7bceb17ef980e52233, but `master` already contains stack steps 1-10 under different SHAs. A mechanical rebase drops or skips the obsolete predecessor commits and leaves only the step-11 verifier commit on top of `master`. That resolves the Git conflict, but the PR's own narrow proof, `pnpm run verify-empty-canonical-sweeps`, fails because the verifier flags doc and contract cleanups that are explicitly deferred to PR #5943 and PR #5944, plus intentional removed-alias rejection references.

  The workflow should reshape the stack the way a reviewer would expect: no PR should advertise a passing sweep proof while depending on later PRs for that proof, and the final sweep should still reject real reintroduced legacy command, IPC, HTTP, or compatibility labels.

tasks:
  - id: restructure-canonical-sweep-stack
    description: |
      Restructure PR #5942 and the adjacent stack slices so the canonical sweep verifier lands only where its proof can pass.
      Review claim: The canonical sweep verifier is positioned and scoped so the PR that introduces or activates it can run its own proof without depending on later stack entries.
      Safety invariant: The change must preserve already-landed runtime behavior from stack steps 1-10 and must not remove intentional negative tests or removed-alias rejection guards.
      Slice rationale: This is one stack-surgery slice because the conflict is caused by stale predecessor ancestry and the proof failure is caused by verifier ordering across PR #5942, #5943, and #5944.
      Architectural effect: No new runtime path is introduced; the effect is to make the tooling-policy gate accurately reflect the canonical command, IPC, HTTP, and storage-label surfaces.
      Goal: Produce a reviewable stack shape where each PR's claimed proof passes at that PR's own head.
      Motivation: A straight rebase makes PR #5942 mergeable but leaves its advertised `bash scripts/verify-empty-canonical-sweeps.sh` proof failing on `master`.
      Alternative considerations: Do not silently weaken the verifier to ignore true live legacy surfaces. Do not fold unrelated cleanup into a single oversized conflict-resolution commit. Either move the verifier activation after the docs and contract cleanup slices, or split PR #5942 into a dormant helper introduction plus a later activation/checker-tightening slice.
      Implementation details: Start from current `master`, fetch PR #5942, #5943, and #5944, and inspect their current head branches before editing. Preserve the intended landed content of stack steps 1-10 already on `master`. Rework the remaining stack so the docs refresh and deprecated IPC-channel deletion happen before any PR whose test plan runs the empty canonical sweep, or split the sweep helper into a non-asserting/dormant helper PR and a later activation PR. Update `scripts/verify-empty-canonical-sweeps.sh` so intentional references are explicit allowlist entries: the removed headless alias rejection guard in `packages/app/src/headless-command-registry.ts` and the tests that prove removed aliases or routes return errors may remain, but live command registries, docs tables, contracts, handlers, API routes, and user-facing usage text must not retain deprecated names. Update PR body/test-plan text if the verifier is split so each PR advertises only proofs that pass at that point in the stack. Publish the final authored stack with Mergify Stacks after local verification is green.
      Non-goals: No unrelated refactors, no UI redesign, no product behavior change outside removing or documenting the deprecated command/IPC/API surfaces already targeted by this stack.
      Layer: transport
      Feature state: active
      Files:
      - scripts/verify-empty-canonical-sweeps.sh
      - package.json
      - docs/persistence-architecture-single-writer.md
      - packages/contracts/src/ipc-channels.ts
      - packages/app/src/headless-command-registry.ts
      - packages/app/src/__tests__/headless-client.test.ts
      - packages/app/src/__tests__/api-server.test.ts
      - packages/app/src/__tests__/parity-regression.test.ts
      - packages/app/e2e/drift/drift-battery.spec.ts
      - packages/app/e2e/drift/drift-thundering-herd.spec.ts
      - packages/app/e2e/drift/scenario-catalog.ts
      Change types:
      - Stack branch/review structure: reorder or split PR #5942/#5943/#5944 so proof dependencies flow forward.
      - scripts/verify-empty-canonical-sweeps.sh: modify only to encode precise allowlist rules for intentional rejection references.
      - package.json: keep or move the verifier script entry with the verifier activation slice.
      - docs/persistence-architecture-single-writer.md: modify only if the docs cleanup remains in the same activated verifier slice.
      - packages/contracts/src/ipc-channels.ts: modify only if the deprecated IPC cleanup remains in the same activated verifier slice.
      - tests: modify only when needed to keep removed-alias rejection coverage while avoiding false-positive verifier matches.
      Acceptance criteria:
      - PR #5942, or its replacement first verifier slice, is based on current `master` without stale predecessor commits.
      - No PR in the resulting stack has a test plan that depends on later stack entries.
      - `pnpm run verify-empty-canonical-sweeps` exits 0 at the PR head that advertises it.
      - The verifier still fails for real deprecated live surfaces and allows only documented negative-test or rejection-guard references.
      - The final PR stack is published with Mergify Stacks for the Invoker repository.
    prompt: |
      Assume no prior context. You are restructuring an Invoker PR stack, not doing a normal one-commit merge-conflict repair.

