    dependencies: []

  - id: verify-canonical-sweep-focus
    description: |
      Run the focused verifier and regression tests for the restructured canonical-sweep stack.
      Review claim: The restructured stack has a passing canonical sweep and keeps removed-alias/removed-route rejection coverage intact.
      Safety invariant: This task only runs deterministic local proof commands after the implementation task.
      Slice rationale: The focused proof directly exercises the failure found during conflict repair before the broader suite runs.
      Architectural effect: None; this is verification only.
      Goal: Prove the sweep verifier and the adjacent app tests agree on what is a removed surface versus an intentional rejection reference.
      Motivation: The original PR's advertised proof failed after a clean rebase onto `master`.
      Alternative considerations: Manual `rg` inspection alone was rejected because the verifier must be executable and repeatable.
      Implementation details: Run `pnpm run verify-empty-canonical-sweeps`, then run the focused app tests that cover removed headless aliases and removed HTTP restart routes.
      Non-goals: No code edits in this task.
      Layer: app_regression
      Feature state: active
    command: "pnpm run verify-empty-canonical-sweeps && cd packages/app && pnpm test -- src/__tests__/headless-client.test.ts src/__tests__/api-server.test.ts src/__tests__/parity-regression.test.ts"
    dependencies:
      - restructure-canonical-sweep-stack

  - id: verify-full-suite
    description: |
      Run the terminal Invoker regression gate after the stack restructuring and focused proof.
      Review claim: The final restructured stack does not regress the repository's required test surface.
      Safety invariant: This task only runs the existing repository-wide test gate and depends on all earlier work.
      Slice rationale: A standalone implementation workflow needs a terminal full-suite gate before PR publication.
      Architectural effect: None; this is verification only.
      Goal: Prove the restructured stack remains compatible with the required CI-equivalent local surface.
      Motivation: Stack surgery touches publication shape and verifier policy, so the final gate should be broader than the focused sweep proof.
      Alternative considerations: Skipping the full suite was rejected because this is the terminal workflow in a standalone implementation plan.
      Implementation details: Run `pnpm run test:all` from the repository root.
      Non-goals: No code edits in this task.
      Layer: e2e_regression
      Feature state: active
    command: "pnpm run test:all"
    dependencies:
      - restructure-canonical-sweep-stack
      - verify-canonical-sweep-focus
