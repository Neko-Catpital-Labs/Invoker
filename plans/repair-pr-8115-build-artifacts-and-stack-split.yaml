name: "Repair PR 8115 build artifacts and stack split"
description: |
  Repair live PR #8115, "[Onboarding wizard hardening](3) Remove old bundled-skills copy, wire main.ts".

  Evidence from the failed `build-artifacts` job shows `packages/app/scripts/verify-workspace-imports.cjs`
  rejects `@invoker/shell/bundled-skills` because it compares the full subpath export against
  `packages/app/package.json` dependencies instead of checking the owning package `@invoker/shell`.

  The latest PR Body job also reports that #8115's base comparison includes activation-surface files
  while its body declares Review Unit `routing`. Treat that as a stack-topology/split problem:
  do not force activation-surface and routing changes into one PR. Preserve one review unit per PR.
onFinish: none
mergeMode: manual
repoUrl: https://github.com/Neko-Catpital-Labs/Invoker.git

tasks:
  - id: repair-pr-8115-build-and-stack
    description: |
      Repair the live #8115 branch and stack shape.
      Review claim: #8115 passes `build-artifacts` because the app workspace import verifier accepts declared package dependencies for subpath exports while still resolving the exact imported subpath.
      Safety invariant: The verifier remains strict: every `@invoker/*` import in `packages/app/src/main.ts` must have its owning package declared and the exact specifier resolvable from the app package root.
      Slice rationale: The build verifier fix belongs with the #8115 routing slice, but any activation-surface files must stay in a prerequisite PR or already-landed base.
      Architectural effect: No runtime behavior changes; this updates build-time dependency validation and PR stack topology only.
      Goal: Make #8115 green for `build-artifacts` and remove the PR Body mixed-review-unit blocker without bundling unrelated review units.
      Motivation: CI is failing because a package dependency guard does not understand workspace subpath exports, and the PR body validator sees upstream activation-surface files in #8115's current base comparison.
      Alternative considerations: Changing the PR body to `activation-surface` was rejected because the #8115 commit itself changes `packages/app/src/main.ts` routing. Bundling all files into one commit was rejected because the validator requires one Review Unit per PR.
      Implementation details: Work directly with PR #8115 (`stack/EdbertChan/pr/onboarding-hardening-skills-mcp/onboarding-wizard-hardening-3-remove-old-bundled--cfdec3c4`) and its prerequisite #8110. First verify live state with `gh pr view 8115 --json headRefName,headRefOid,baseRefName,body` and `gh pr view 8110 --json state,headRefName,headRefOid,mergeCommit,baseRefName`. Fetch the #8115 head and reproduce `node packages/app/scripts/verify-workspace-imports.cjs`. Fix `packages/app/scripts/verify-workspace-imports.cjs` so dependency declarations are checked against `@scope/package` from each `@invoker/*` specifier, while `require.resolve` still checks the original specifier. Add or update `packages/app/src/__tests__/workspace-import-resolution.test.ts` so it executes that verifier and catches subpath-export drift.
      Files:
      - packages/app/scripts/verify-workspace-imports.cjs
      - packages/app/src/__tests__/workspace-import-resolution.test.ts
      - PR #8115 branch/base/body metadata as needed to preserve one review unit per PR
      Change types:
      - packages/app/scripts/verify-workspace-imports.cjs: modify
      - packages/app/src/__tests__/workspace-import-resolution.test.ts: modify
      - PR #8115 stack metadata: modify only if PR Body still reports mixed review units after refreshing live base state
      Acceptance criteria:
      - `node packages/app/scripts/verify-workspace-imports.cjs` exits 0 on the repaired #8115 branch.
      - `pnpm --filter @invoker/app test -- src/__tests__/workspace-import-resolution.test.ts` exits 0.
      - The CI-equivalent `build-artifacts` command from `.github/workflows/ci.yml` exits 0, including the final artifact archive step.
      - PR Body validation no longer reports `Review Unit "routing" cannot ship with activation-surface files`; if it still does, restack or split #8115 so activation-surface files are in #8110 or a separate prerequisite PR and #8115's diff is routing-only.
      - Do not push until the repaired branch/stack has deterministic local proof. When pushing live branches, use non-destructive safe-push semantics and preserve the existing PR history as much as possible.
    prompt: |
      Assume no prior chat context. Repair live PR #8115 in Neko-Catpital-Labs/Invoker: https://github.com/Neko-Catpital-Labs/Invoker/pull/8115. Files: packages/app/scripts/verify-workspace-imports.cjs and packages/app/src/__tests__/workspace-import-resolution.test.ts. Acceptance criteria: the verifier, focused Vitest repro, CI build-artifacts command from .github/workflows/ci.yml, and PR Body mixed-review-unit validation must all pass.

