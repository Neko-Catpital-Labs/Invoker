# Expected outcome: skill-doctor passes schema and planning completeness, then
# fails lint-task-atomicity because a Standalone workflow waiver is used to
# ship prompt tasks from two review lanes (behavior and policy) as one PR.
name: "Waiver spans review lanes"
description: |
  Standalone workflow waiver:
  - This fixture intentionally waives the stack split for two prompt tasks in different review lanes so atomicity lint can reject it.
onFinish: pull_request
mergeMode: external_review
repoUrl: git@github.com:Neko-Catpital-Labs/Invoker.git
tasks:
  - id: implement-autofix-recovery-scan
    description: |
      Review claim:
      - The recovery worker should submit one auto-fix mutation intent for each eligible failed task.
      Review lane:
      - behavior
      Safety invariant:
      - The change only submits through the existing fix-with-agent mutation route and skips stale task candidates.
      Effectiveness measurement:
      - `pnpm --filter @invoker/app exec vitest run src/__tests__/auto-fix-recovery.test.ts` exits 0.
      Slice rationale:
      - The scan and submit behavior is one behavior claim.
      Architectural effect:
      - The recovery worker bridges persisted failed tasks to workflow mutation intents.
      Goal:
      - Restore auto-fix work for failed tasks discovered by the recovery worker.
      Motivation:
      - Persisted failed tasks need a worker-side path that can recover after process restarts.
      Alternative considerations:
      - Option A (chosen for fixture): pair this behavior with a policy task under one waiver.
      - Option B: publish the behavior and the policy change as a two-workflow chain.
      Implementation details:
      - Scan failed tasks, skip stale candidates, and submit a fix-with-agent mutation intent.
      Non-goals:
      - Do not change the retry policy file.
      Layer: domain
      Feature state: active
      Files:
      - packages/app/src/workers/auto-fix-recovery.ts
      - packages/app/src/__tests__/auto-fix-recovery.test.ts
      Change types:
      - Add failed-task candidate scanning
      - Add mutation intent submission
      Acceptance criteria:
      - Eligible failed tasks submit exactly one fix-with-agent mutation intent.
    prompt: |
      Review claim:
      - The recovery worker should submit one auto-fix mutation intent for each eligible failed task.
      Review lane:
      - behavior
      Safety invariant:
      - The change only submits through the existing fix-with-agent mutation route and skips stale task candidates.
      Slice rationale:
      - The scan and submit behavior is one behavior claim.
      Architectural effect:
      - The recovery worker bridges persisted failed tasks to workflow mutation intents.
      Goal:
      - Restore auto-fix work for failed tasks discovered by the recovery worker.
      Motivation:
      - Persisted failed tasks need a worker-side path that can recover after process restarts.
      Alternative considerations:
      - Option A (chosen for fixture): pair this behavior with a policy task under one waiver.
      - Option B: publish the behavior and the policy change as a two-workflow chain.
      Implementation details:
      - Scan failed tasks, skip stale candidates, and submit a fix-with-agent mutation intent.
      Non-goals:
      - Do not change the retry policy file.
      Acceptance criteria:
      - Ensure eligible failed tasks submit exactly one fix-with-agent mutation intent.
      Assume no prior context. Modify packages/app/src/workers/auto-fix-recovery.ts and packages/app/src/__tests__/auto-fix-recovery.test.ts. Pass condition: pnpm --filter @invoker/app exec vitest run src/__tests__/auto-fix-recovery.test.ts exits 0.
    dependencies: []
  - id: tune-autofix-retry-policy
    description: |
      Review claim:
      - The auto-fix retry limit should come from the recovery policy file instead of a constant.
      Review lane:
      - policy
      Safety invariant:
      - The policy file keeps the current retry limit as its default value.
      Effectiveness measurement:
      - `node scripts/validate-plan.mjs skills/plan-to-invoker/fixtures/positive/01-minimal-verification.yaml` exits 0.
      Slice rationale:
      - The retry limit is tooling policy, separate from the scan behavior.
      Architectural effect:
      - The retry limit moves from code into a policy file.
      Goal:
      - Let operators tune the auto-fix retry limit without a code change.
      Motivation:
      - Retry limits change more often than the recovery scan.
      Alternative considerations:
      - Option A (chosen for fixture): ride along with the behavior task under the waiver.
      - Option B: ship the policy change as its own workflow.
      Implementation details:
      - Add the retry limit to the policy file with the current default.
      Non-goals:
      - Do not change the recovery scan.
      Layer: domain
      Feature state: active
      Files:
      - scripts/auto-fix-recovery-policy.json
      Change types:
      - Add retry limit policy entry
      Acceptance criteria:
      - The policy file declares the current retry limit as its default.
    prompt: |
      Review claim:
      - The auto-fix retry limit should come from the recovery policy file instead of a constant.
      Review lane:
      - policy
      Safety invariant:
      - The policy file keeps the current retry limit as its default value.
      Slice rationale:
      - The retry limit is tooling policy, separate from the scan behavior.
      Architectural effect:
      - The retry limit moves from code into a policy file.
      Goal:
      - Let operators tune the auto-fix retry limit without a code change.
      Motivation:
      - Retry limits change more often than the recovery scan.
      Alternative considerations:
      - Option A (chosen for fixture): ride along with the behavior task under the waiver.
      - Option B: ship the policy change as its own workflow.
      Implementation details:
      - Add the retry limit to the policy file with the current default.
      Non-goals:
      - Do not change the recovery scan.
      Acceptance criteria:
      - Ensure the policy file declares the current retry limit as its default.
      Assume no prior context. Modify scripts/auto-fix-recovery-policy.json. Pass condition: the file parses as JSON and declares the retry limit.
    dependencies: []
  - id: final-regression
    description: |
      Review claim:
      - Run the terminal full-suite regression gate.
      Review lane:
      - proof
      Safety invariant:
      - This command changes no production code and only validates the fixture.
      Effectiveness measurement:
      - `pnpm run test:all` exits 0.
      Slice rationale:
      - Terminal validation is separate from implementation work.
      Architectural effect:
      - No architecture change.
      Goal:
      - Run final full-suite regression gate.
      Motivation:
      - Ensure implementation updates remain stable.
      Alternative considerations:
      - Option A (chosen): full repository regression.
      - Option B: package-only checks.
      Implementation details:
      - Execute root-level test gate after implementation tasks.
      Non-goals:
      - Do not modify source files.
      Layer: app_regression
      Feature state: active
    command: "pnpm run test:all"
    dependencies: [implement-autofix-recovery-scan, tune-autofix-retry-policy]
  - id: scrub-handoff-artifacts
    description: |
      Review claim:
      - Scrub ephemeral inter-task handoff files before the PR merge gate.
      Review lane:
      - cleanup
      Safety invariant:
      - Do not touch the home Invoker ledger.json; only remove ephemeral handoff files in the worktree.
      Effectiveness measurement:
      - `bash scripts/scrub-handoff-artifacts.sh` exits 0.
      Slice rationale:
      - Handoff scrub is a required terminal leaf after implementation and verification.
      Architectural effect:
      - No architecture change; removes ephemeral handoff artifacts only.
      Goal:
      - Remove ephemeral inter-task handoff files before merge.
      Motivation:
      - Handoff artifacts must not ship in the PR.
      Alternative considerations:
      - Option A (chosen): dedicated scrub script and terminal task.
      - Option B: rely on .gitignore only.
      Implementation details:
      - Run scripts/scrub-handoff-artifacts.sh and fail if handoff files remain.
      Non-goals:
      - No feature edits.
      Layer: e2e_regression
      Feature state: active
    command: "bash scripts/scrub-handoff-artifacts.sh"
    dependencies: [final-regression]
