name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

env:
  CI: true
  NODE_VERSION: '26'

jobs:
  guard-version:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Guard release is exactly a minor bump
        run: |
          CURRENT_REF="${{ github.sha }}"
          PREVIOUS_TAG=$(git tag -l 'v*' --sort=-version:refname --merged "$CURRENT_REF^" | head -1)
          if [ -z "$PREVIOUS_TAG" ]; then
            echo "No previous v* release tag found; skipping guard for the first release."
            exit 0
          fi
          PREVIOUS_VERSION=$(git show "$PREVIOUS_TAG:package.json" | node -e "console.log(JSON.parse(require('fs').readFileSync(0,'utf8')).version)")
          EXPECTED_VERSION=$(node scripts/bump-release-version.mjs --type minor --dry-run --from "$PREVIOUS_VERSION")
          CURRENT_VERSION=$(node -e "console.log(require('./package.json').version)")
          if [ "$CURRENT_VERSION" != "$EXPECTED_VERSION" ]; then
            echo "Release version guard failed: expected a minor bump from $PREVIOUS_VERSION ($EXPECTED_VERSION), but package.json has $CURRENT_VERSION." >&2
            exit 1
          fi
          echo "Release version guard passed: $PREVIOUS_VERSION -> $CURRENT_VERSION"

  build:
    needs: guard-version
    uses: ./.github/workflows/reusable-release-build.yml

  publish-release:
    needs:
      - build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: '*'
          merge-multiple: true
          path: release

      - name: Generate combined checksums
        run: bash scripts/release-sha256.sh

      - name: Verify complete release asset set
        run: bash scripts/verify-release-assets.sh

      - name: Generate release notes from CHANGELOG
        run: |
          version="$(node -p "require('./package.json').version")"
          node scripts/extract-changelog-section.mjs "$version" --out release/RELEASE_NOTES.md
          cat release/RELEASE_NOTES.md

      - name: Publish GitHub release assets
        uses: softprops/action-gh-release@v2
        with:
          body_path: release/RELEASE_NOTES.md
          files: |
            release/*.dmg
            release/*.deb
            release/*.AppImage
            release/*.zip
            release/invoker-cli-*
            release/invoker-slack-*
            release/invoker-watcher-*
            release/SHA256SUMS

      - name: Install pnpm
        if: startsWith(github.ref, 'refs/tags/v')
        uses: pnpm/action-setup@v4

      - name: Use Node.js ${{ env.NODE_VERSION }}
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          registry-url: https://registry.npmjs.org
          cache-dependency-path: |
            pnpm-lock.yaml
            .node-version

      - name: Install dependencies for npm publish
        if: startsWith(github.ref, 'refs/tags/v')
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Publish npm packages
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          publish_if_missing() {
            local package_dir="$1"
            local name
            local version

            name="$(node -p "require('./${package_dir}/package.json').name")"
            version="$(node -p "require('./${package_dir}/package.json').version")"

            if npm view "${name}@${version}" version >/dev/null 2>&1; then
              echo "${name}@${version} is already published; skipping"
              return
            fi

            # Pack with pnpm (rewrites workspace:* deps to the exact version),
            # then publish the tarball with npm (which would not rewrite them).
            local tarball
            tarball="$(pnpm --filter "${name}" pack --pack-destination "${RUNNER_TEMP}" | tail -n 1)"
            npm publish "${tarball}" --access public
          }

          publish_if_missing packages/npm-cli
          publish_if_missing packages/npm-ui
          publish_if_missing packages/npm-slack
          publish_if_missing packages/npm-watcher
