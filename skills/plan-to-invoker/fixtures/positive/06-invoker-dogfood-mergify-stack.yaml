# Invoker-on-Invoker dogfood example with publication kept as a later explicit action.
# Source: examples.md Section 7

name: "Dogfood Invoker CI docs update"
description: |
  Updates Invoker's own contributor guidance for merge automation.

  This plan still uses the normal Invoker PR gate shape: `onFinish: pull_request`
  with `mergeMode: external_review`. Approval/submission of the Invoker plan stops
  at that review handoff; it does not itself publish or update GitHub PRs.

  Because the target repo is Invoker itself, treat GitHub PR publication as a
  later explicit action after the workflow commits are ready. That separate PR
  publication action should follow the make-pr workflow and use `mergify stack push`
  so stacked PRs stay synchronized.
onFinish: pull_request
mergeMode: external_review
repoUrl: git@github.com:EdbertChan/Invoker.git
baseBranch: master
featureBranch: docs/dogfood-mergify-stack

tasks:
  - id: update-dogfood-guidance
    description: "Clarify when Invoker-on-Invoker changes should use Mergify Stacks"
    prompt: |
      Update the Invoker skills and examples so they are explicit about the
      repo-specific dogfood rule:

      1. When the target repo is Invoker itself, keep `mergeMode: external_review`
         and make plain plan approval/submission stop at the Invoker review handoff.
      2. Show GitHub PR publication as a later explicit action: after the workflow
         commits are ready and PR publication is requested, follow the make-pr
         workflow and publish/update the resulting commit stack with
         `mergify stack push`.
      3. When the target repo is an external repo, keep normal PR flow unless
         that repo independently uses Mergify Stacks.

      Acceptance criteria:
      - Relevant skills mention the Invoker-only scope.
      - Examples include an Invoker positive case and an external-repo counterexample.
      - The Invoker positive case separates plan approval/submission from later
        PR publication.
    dependencies: []

  - id: verify-skill-fixtures
    description: "Run the plan-to-invoker fixture tests"
    command: "bash skills/plan-to-invoker/scripts/test-fixtures.sh"
    dependencies: [update-dogfood-guidance]
